const GAME_INFO={peel:{name:'PEEL CORE',jp:'最後まで残るのは？',color:'#139f8b',soft:'#e6f6f0',category:'NETWORK',count:18},triple:{name:'TRIPLE TURN',jp:'3つずつ、くるり。',color:'#7867d9',soft:'#eeecff',category:'PERMUTATION',count:18},experiment:{name:'ONE EXPERIMENT',jp:'一度の実験で、見抜け。',color:'#7960ca',soft:'#eeeaff',category:'DEDUCTION',count:18},flow:{name:'FLOW SPLITTER',jp:'分けて、色をそろえる。',color:'#299fbb',soft:'#e6f5f9',category:'DISTRIBUTION',count:18}};

// PEEL CORE: one optional edge closes precisely one cycle in a tree.
function graphCore(n,edges){let deg=Array(n).fill(0),adj=Array.from({length:n},()=>[]);for(const [a,b] of edges){deg[a]++;deg[b]++;adj[a].push(b);adj[b].push(a)}let removed=Array(n).fill(false),waves=[];while(true){const layer=[];for(let i=0;i<n;i++)if(!removed[i]&&deg[i]<=1)layer.push(i);if(!layer.length)break;layer.forEach(i=>removed[i]=true);for(const i of layer)for(const k of adj[i])deg[k]--;waves.push(layer)}return {core:removed.map((v,i)=>!v?i:-1).filter(v=>v>=0),waves}}
function makePeel(stage){const cols=stage<=3?3:stage<=10?3:4,rows=stage<=3?2:3,n=cols*rows,r=rng(120003+stage*179);const positions=Array.from({length:n},(_,i)=>({x:48+(i%cols)*(264/(cols-1)),y:59+Math.floor(i/cols)*(242/(rows-1))}));const gridEdges=[];for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const k=y*cols+x;if(x+1<cols)gridEdges.push([k,k+1]);if(y+1<rows)gridEdges.push([k,k+cols])}const parent=Array.from({length:n},(_,i)=>i),root=i=>{while(parent[i]!==i)i=parent[i];return i};const tree=[],options=[];for(const [a,b] of shuffle(gridEdges,r)){const ra=root(a),rb=root(b);if(ra!==rb){parent[ra]=rb;tree.push([a,b])}else options.push([a,b])}const opts=shuffle(options,r).slice(0,stage<=3?2:stage<=10?3:4);let candidates=opts.map(edge=>({edge,...graphCore(n,[...tree,edge])}));candidates=candidates.filter(c=>c.core.length>=3);if(candidates.length<2)candidates=opts.map(edge=>({edge,...graphCore(n,[...tree,edge])}));const answer=candidates[(stage*7+1)%candidates.length];return {positions,tree,candidates,answer,selected:-1,revealed:false,core:[],waves:[]}}
function peelBoard(){const p=state.peel,n=p.positions.length;const pos=i=>p.positions[i],line=([a,b],cls,extra='')=>`<line x1="${pos(a).x}" y1="${pos(a).y}" x2="${pos(b).x}" y2="${pos(b).y}" class="${cls}" ${extra}/>`;const coreset=new Set(p.core);let lines=p.tree.map(e=>line(e,'edge')).join('');p.candidates.forEach((c,i)=>{lines+=line(c.edge,'candidate '+(p.selected===i?'selected':''));lines+=line(c.edge,'hitline',`data-peel="${i}" role="button" aria-label="橋 ${i+1} を選ぶ"`) });const points=p.positions.map(({x,y},i)=>{let cl=(p.revealed?(coreset.has(i)?'core':'dead'):'');return `<g class="node ${cl}" data-node="${i}">${p.answer.core.includes(i)?`<circle class="node-target" cx="${x}" cy="${y}" r="20"/>`:''}<circle class="node-circle" cx="${x}" cy="${y}" r="12"/><circle class="node-mid" cx="${x}" cy="${y}" r="4.7"/></g>`}).join('');return `<div class="board"><div class="board-inner"><div class="board-top"><span class="board-label">01 / CONNECT & SURVIVE</span><span class="rule">橋を1本つなごう</span></div><div class="board-scene"><svg class="scene-svg" viewBox="0 0 360 360" role="img" aria-label="線と点からなるネットワークの盤面">${lines}${points}</svg></div><div class="legend"><span><i class="circle"></i>光る点を残す</span><span><i class="dash"></i>点線をタップ</span></div><div class="btnrow"><button class="mainbtn" id="action-main" data-action="peelrun" ${p.selected<0||state.playing||state.solved?'disabled':''}>連鎖を見る <span aria-hidden="true">↗</span></button></div><div class="micro-status" id="micro-status" aria-live="polite">${esc(state.status||'端から消えていく。最後に残るのは？')}</div><div class="success" id="success" style="display:none"></div></div></div>`}

function runPeel(){const p=state.peel;if(p.selected<0||state.playing||state.solved)return;state.playing=true;state.moves++;updateMoves();tone('run');const c=p.candidates[p.selected];p.core=c.core;p.waves=c.waves;p.revealed=false;$('#action-main').disabled=true;setStatus('端から順番に、消えていく…');let delay=0;const runWave=(k)=>{if(state.screen!=='game'||state.game!=='peel'||state.peel!==p)return;const nodes=p.waves[k];if(nodes){nodes.forEach(i=>{const el=document.querySelector(`.node[data-node="${i}"]`);if(el)el.classList.add('dead')});setTimeout(()=>runWave(k+1),280)}else{p.revealed=true;$$('.node').forEach((el,i)=>{if(c.core.includes(i))el.classList.add('core')});const good=c.core.length===p.answer.core.length&&c.core.every(i=>p.answer.core.includes(i));setTimeout(()=>{if(state.peel!==p)return;state.playing=false;if(good){setStatus('狙いどおりの形が残った！');success('線を一本変えるだけで、残る構造が変わる。')}else{setStatus('惜しい！つながりを変えてみよう');tone('no');setTimeout(()=>{if(state.peel===p&&!state.solved){p.revealed=false;renderBoard()}},750)}},350)}};setTimeout(()=>runWave(0),220)}
// TRIPLE TURN: deterministic BFS ensures every stage has a mathematically known minimum.
const tripleDist={};function rotate3(arr,i){const b=arr.slice();[b[i],b[i+1],b[i+2]]=[arr[i+2],arr[i],arr[i+1]];return b}function rotate3Left(arr,i){const b=arr.slice();[b[i],b[i+1],b[i+2]]=[arr[i+1],arr[i+2],arr[i]];return b}function distTriple(n){if(tripleDist[n])return tripleDist[n];const root=Array.from({length:n},(_,i)=>i+1),m=new Map([[root.join(','),0]]),q=[root];for(let k=0;k<q.length;k++){const arr=q[k],d=m.get(arr.join(','));for(let i=0;i<n-2;i++){const b=rotate3Left(arr,i),key=b.join(',');if(!m.has(key)){m.set(key,d+1);q.push(b)}}}return tripleDist[n]=m}
function makeTriple(stage){const n=stage<=3?4:stage<=7?5:stage<=13?6:7;const dm=distTriple(n);const max=Math.max(...dm.values());const aim=stage<=3?stage:stage<=7?Math.min(max,stage-2):stage<=13?Math.min(max,stage-6):Math.min(max,stage-11);const candidates=[...dm.entries()].filter(([k,v])=>v===aim).map(([k])=>k.split(',').map(Number));const r=rng(7051+stage*59);const initial=candidates[Math.floor(r()*candidates.length)]||Array.from({length:n},(_,i)=>i+1);return {n,goal:Array.from({length:n},(_,i)=>i+1),arr:initial.slice(),history:[],optimal:dm.get(initial.join(',')),lastMove:-1}}

function doTriple(i){const p=state.triple;if(state.solved||state.playing)return;const prev={};$$('#triple-now .token').forEach(x=>prev[x.dataset.val]=x.getBoundingClientRect());p.history.push(p.arr.slice());p.arr=rotate3(p.arr,i);state.moves++;tone('turn');const wrap=$('#triple-now');wrap.innerHTML=renderTokens(p.arr);if(!matchMedia('(prefers-reduced-motion: reduce)').matches)$$('#triple-now .token').forEach(x=>{const old=prev[x.dataset.val],now=x.getBoundingClientRect();if(old){x.animate([{transform:`translate(${old.left-now.left}px,${old.top-now.top}px)`},{transform:'translate(0,0)'}],{duration:300,easing:'cubic-bezier(.2,.9,.23,1)'})}});updateMoves();const solved=p.arr.every((v,j)=>v===p.goal[j]);if(solved){state.playing=true;$$('.turn-button').forEach(b=>b.disabled=true);setTimeout(()=>{if(state.game==='triple'&&state.triple===p){state.playing=false;success(`${state.moves}手で完成 · この問題の最短は${p.optimal}手`)}},280)}else setStatus(state.moves===1?'いい感じ。次の3つはどこ？':'あと少し。先の並びを考えよう')}

// ONE EXPERIMENT: distinguish transformations with a single input.
const ops=[{id:'p1',label:'+1',fn:x=>x+1},{id:'p2',label:'+2',fn:x=>x+2},{id:'p3',label:'+3',fn:x=>x+3},{id:'p4',label:'+4',fn:x=>x+4},{id:'p5',label:'+5',fn:x=>x+5},{id:'m2',label:'×2',fn:x=>x*2},{id:'m3',label:'×3',fn:x=>x*3},{id:'sq',label:'□²',fn:x=>x*x},{id:'r10',label:'10−□',fn:x=>10-x},{id:'r12',label:'12−□',fn:x=>12-x},{id:'m21',label:'×2+1',fn:x=>2*x+1},{id:'m2n',label:'×2−1',fn:x=>2*x-1},{id:'m31',label:'×3−1',fn:x=>3*x-1}];
function makeExperiment(stage){const r=rng(1317+stage*241);let rules,valid=[];if(stage===1)rules=[ops[0],ops[1],ops[5]];else if(stage===2)rules=[ops[0],ops[5],ops[6]];else if(stage===3)rules=[ops[2],ops[5],ops[6]];else{const pool=ops.filter((_,i)=>stage<7?i<8:stage<12?i<11:true),count=stage>=10?4:3;for(let t=0;t<3000;t++){const tmp=shuffle(pool,r).slice(0,count);const vals=Array.from({length:6},(_,i)=>tmp.map(op=>op.fn(i+1)));const wins=vals.map((v,i)=>new Set(v).size===count?i+1:0).filter(Boolean);if(wins.length>=1&&wins.length<=(stage>=10?2:3)&&vals.every(arr=>arr.every(x=>x>=0&&x<=38))){rules=tmp;break}}rules=rules||[ops[0],ops[1],ops[5]]}valid=Array.from({length:6},(_,i)=>i+1).filter(x=>new Set(rules.map(o=>o.fn(x))).size===rules.length);return {rules,valid,secret:Math.floor(r()*rules.length),input:1,phase:'choose',observed:null,guess:null}}
function experBoard(){const p=state.experiment,showResult=p.phase==='guess',isDone=state.solved;const cards=p.rules.map((op,i)=>`<button class="machine ${showResult?'selectable':''} ${p.guess===i?(p.guess===p.secret?'winner':'wrong'):''}" data-machine="${i}" ${showResult&&!isDone?'':'disabled'}><span class="machine-id">MACHINE ${String.fromCharCode(65+i)}</span><span class="machine-icon">◇</span><span class="formula">${esc(op.label)}</span></button>`).join('');return `<div class="board"><div class="board-inner"><div class="board-top"><span class="board-label">03 / ASK THE RIGHT QUESTION</span><span class="rule">1回だけ、試せる</span></div><div class="board-scene experiment-scene"><div class="mystery"><div class="chamber">${p.observed===null?'?':`<span class="output">${p.observed}</span>`}</div><div class="caption">${p.observed===null?'ひみつの機械が1台隠れている':'ひみつの機械が出した数字'}</div></div><div class="subheading">候補の機械 / どれか1台だけが本物</div><div class="rulecards ${p.rules.length===4?'four':''}">${cards}</div><div class="subheading">${showResult?'どの機械の答えだろう？':'試す数字を1つ選ぼう'}</div>${showResult?`<div class="exper-prompt">上の機械を1つタップして答えよう</div>`:`<div class="input-pills">${[1,2,3,4,5,6].map(x=>`<button class="numchip ${p.input===x?'sel':''}" data-input="${x}" aria-label="入力${x}">${x}</button>`).join('')}</div>`}</div><div class="btnrow"><button class="mainbtn" data-action="experrun" ${showResult||isDone?'disabled':''}>${p.phase==='choose'?'実験する ↗':'結果を見る'}</button>${showResult?'<button class="mutebtn" data-action="experreset">もう一度</button>':''}</div><div class="micro-status" id="micro-status" aria-live="polite">${esc(state.status||(showResult?'出てきた数字から本物を当てよう':'全ての候補を見分けられる数字はどれ？'))}</div><div class="success" id="success" style="display:none"></div></div></div>`}
function chooseInput(x){if(state.experiment.phase!=='choose'||state.solved)return;state.experiment.input=x;tone('tap');$$('.numchip').forEach(el=>el.classList.toggle('sel',+el.dataset.input===x))}

function flowV2Skip(){const p=state.flow;if(!p||!state.playing)return;p.runNonce++;p.cursor=p.balls.length;p.liveBits=p.planned.finalBits.slice();p.liveBins=p.planned.bins.map(a=>a.slice());flowV2Finish(p)}
async function flowV2Process(one){
  const p=state.flow;if(!p||state.solved||state.playing)return;
  if(p.cursor>=p.balls.length){flowV2Clear(p)}
  if(!p.planned)p.planned=flowCalc(p.balls,p.bits,p.n);
  state.playing=true;state.status='';const nonce=++p.runNonce;renderBoard();
  const start=p.cursor,total=p.balls.length,fast=!one&&state.stage>2;
  for(let i=start;i<(one?Math.min(start+1,total):total);i++){
    if(!await flowV2One(p,p.planned.events[i],nonce,fast))return;
  }
  if(state.flow!==p||p.runNonce!==nonce)return;
  if(p.cursor===total)flowV2Finish(p);
  else{state.playing=false;renderBoard();setStatus('玉が通ると矢印が反転。次の玉はどこへ？')}
}
