'use strict';
const COLOR=['#E4A079','#80B4CF','#B49CCC','#E2C477','#77BBAB','#D99DA5','#93B4BC'];
const STORE='bd_discovery_02_';
function readStore(k,fallback){try{return JSON.parse(localStorage.getItem(STORE+k))??fallback}catch{return fallback}}

const st={screen:'home',game:'radius',stage:0,source:[4,4],echo:[],drag:null,animation:0,playing:false,actual:null,complete:readStore('complete',{radius:[],echo:[]}),rating:readStore('rating',{}),sound:readStore('sound',true),undo:[],selected:-1,status:'',audio:null,grainTick:0};

function sound(kind='move',index=0){
 if(!st.sound)return;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!st.audio)st.audio=new AC();if(st.audio.state==='suspended')st.audio.resume();
  const now=st.audio.currentTime;
  function pluck(f,at=0,duration=.11,volume=.022){
   const osc=st.audio.createOscillator(),over=st.audio.createOscillator(),gain=st.audio.createGain(),high=st.audio.createGain();
   osc.type='sine';osc.frequency.setValueAtTime(f,now+at);over.type='sine';over.frequency.setValueAtTime(2*f,now+at);
   gain.gain.setValueAtTime(.0001,now+at);gain.gain.exponentialRampToValueAtTime(volume,now+at+.008);gain.gain.exponentialRampToValueAtTime(.0001,now+at+duration);
   high.gain.value=.11;osc.connect(gain);over.connect(high);high.connect(gain);gain.connect(st.audio.destination);osc.start(now+at);over.start(now+at);osc.stop(now+at+duration+.018);over.stop(now+at+duration+.018);
  }
  if(kind==='move')pluck(380,0,.045,.010);
  else if(kind==='place')pluck(410,0,.12,.035);
  else if(kind==='lift')pluck(520,0,.07,.012);
  else if(kind==='hit')pluck([523,587,659,784,880,988,1046][index%7],0,.23,.023);
  else if(kind==='verify'){pluck(392,0,.12,.02);pluck(494,.055,.15,.014)}
  else if(kind==='fail'){pluck(330,0,.1,.016);pluck(294,.07,.16,.009)}
  else if(kind==='win'){pluck(392,0,.23,.034);pluck(494,.10,.26,.025);pluck(587,.21,.3,.022);pluck(784,.31,.40,.018)}
 }catch(e){}
}

 const up=e=>{const d=st.drag;if(!d||d.type!=='echo'||d.id!==e.pointerId)return;st.drag=null;if(d.candidate!==st.echo[d.index]){st.echo[d.index]=d.candidate;commitUndo(d.before);clearEvaluation()}
  paintEcho();sound('place');
  const g=$('#pegLayer')?.querySelector(`[data-peg="${d.index}"]`);if(g&&g.animate)g.animate([{transform:`translate(${d.x}px,94px)`},{transform:`translate(${eX(st.echo[d.index])}px,106px)`}],{duration:170,easing:'cubic-bezier(.2,.8,.2,1)'});
 };

}

async function verifyEcho(){if(st.playing||st.echo.length!==current().marks)return;
 st.playing=true;const id=++st.animation;const btn=$('[data-act="run"]');if(btn)btn.disabled=true;const l=current(),got=echoDist(st.echo),goal=l.dist,win=got.join(',')===goal.join(','),score=multisetScore(goal,got);

   if(k===0||k===pairs.length-1)sound('move');

  }scan.innerHTML='';}
 if(id!==st.animation)return;
